name: Publish to npm

# The only workflow that publishes to npm. npm trusted publishing (OIDC) is
# bound to this file name, so every publish path lives here:
#   - push to main: test, bump the patch, commit, tag, push, then publish.
#   - push of a version tag, or workflow_dispatch: publish package.json as is.
# Tags are plain semver (no "v" prefix). Release commits carry [skip ci].
on:
  push:
    branches: [main]
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  release:
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      # main is not branch-protected, so the default GITHUB_TOKEN can push the release commit.
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm test

      - name: Bump version, tag, and push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          node --check bin/cli.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p));const v=j.version.split('.');v[2]=+v[2]+1;j.version=v.join('.');fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log(j.version)")
          git add package.json
          git commit -m "chore: release ${NEW_VERSION} [skip ci]"
          git tag "${NEW_VERSION}"
          git push origin main
          git push origin "${NEW_VERSION}"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const v=require('./package.json').version; const tag=process.env.GITHUB_REF_NAME; if(tag!==v){console.error('Tag '+tag+' does not match package version '+v); process.exit(1);} console.log('Tag '+tag+' matches package v'+v);"

      - run: npm publish --access public
